[package]
name = "git-fs"
version = "4.4.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Git session branches for AI agents: guarded reads, writes, edits and search on refs/gitfs/<session>, materialized to the worktree on your terms."

[lib]
name = "gitfs"
path = "src/lib.rs"

[[bin]]
name = "git-fs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4"
futures = "0.3"
globset = "0.4.20"
regex = "1.13.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"

[profile.release]
lto = "thin"
